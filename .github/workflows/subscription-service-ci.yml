name: subscription-service CI

on:
  push:
    branches: [dev]
    paths: [subscription-service/**]
  pull_request:
    branches: [test, main]
    paths: [subscription-service/**]

env:
  IMAGE_NAME: subscription-service

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: subscription-service

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: subscription-service/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      # Build ONLY on dev push
      - name: Configure AWS creds
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Get ECR repo
        if: github.event_name == 'push'
        id: ecr
        run: |
          ECR_URL=$(aws ecr describe-repositories \
            --repository-names $IMAGE_NAME \
            --query 'repositories[0].repositoryUri' \
            --output text)
          echo "url=$ECR_URL" >> $GITHUB_OUTPUT

      - name: Login to ECR
        if: github.event_name == 'push'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: subscription-service
          push: true
          tags: ${{ steps.ecr.outputs.url }}:${{ github.sha }}