name: subscription-service CI

on:
  push:
    branches: [dev]
    paths: [subscription-service/**]
  workflow_dispatch:
jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read

    defaults:
      run:
        working-directory: subscription-service

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: subscription-service/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - run: pnpm eslint .

      - run: pnpm test

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: "us-east-1"

      - name: Get ECR URL
        id: ecr
        run: |
          ECR_URL=$(aws ecr describe-repositories --repository-names subscription-service \
            --query 'repositories[0].repositoryUri' --output text)
          echo "url=$ECR_URL" >> $GITHUB_OUTPUT

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@v7
        with:
          context: subscription-service
          push: false
          load: true
          tags: ${{ steps.ecr.outputs.url }}:sha-${{ github.sha }}
          secrets: |
            buf_token=${{ secrets.BUF_TOKEN }}

      - name: Trivy image scan (scan-before-push gate)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.ecr.outputs.url }}:sha-${{ github.sha }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-java-db:1
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      - name: Push scanned image
        run: docker push "${{ steps.ecr.outputs.url }}:sha-${{ github.sha }}"
